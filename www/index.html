<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Kamera Simpel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; align-items: center; padding: 20px 0; }
        h2 { font-size: 1.2rem; font-weight: 500; }
        .camera-container { width: 90%; max-width: 400px; aspect-ratio: 3/4; background-color: #000; border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        video, canvas { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        canvas { display: none; }
        .controls { display: flex; justify-content: center; width: 100%; padding-bottom: 20px; }
        button { background-color: #ffffff; color: #121212; border: none; padding: 15px 30px; font-size: 1rem; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(255,255,255,0.2); }
        button:active { background-color: #dddddd; transform: scale(0.95); }
    </style>
</head>
<body>
    <h2>Kamera Sederhana</h2>
    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>
    <div class="controls">
        <button id="capture-btn">Ambil Foto</button>
    </div>
    <script src="js/index.js"></script>
</body>
</html>
